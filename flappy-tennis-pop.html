<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🎾 플래피 테니스 - 팝테니스 화원옥포</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Press+Start+2P&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a1628;display:flex;justify-content:center;align-items:center;min-height:100dvh;font-family:'Noto Sans KR',sans-serif;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none}
  #gameWrapper{position:relative;width:100%;max-width:420px;aspect-ratio:9/16;max-height:100dvh}
  canvas{display:block;width:100%;height:100%;border-radius:8px;box-shadow:0 0 60px rgba(200,255,0,0.15)}
  #uiOverlay{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow-y:auto}
  #uiOverlay.active{pointer-events:auto}
  .screen{display:none;flex-direction:column;align-items:center;text-align:center;padding:20px;width:100%}
  .screen.visible{display:flex}
  .title{font-family:'Press Start 2P',monospace;font-size:18px;color:#c8ff00;text-shadow:0 0 20px rgba(200,255,0,0.6),2px 2px 0 #1a4d00;margin-bottom:6px;line-height:1.6}
  .club-banner{width:85%;margin:0 auto 16px;padding:14px 18px;background:linear-gradient(135deg,rgba(200,255,0,0.12),rgba(255,215,0,0.08));border:2px solid rgba(200,255,0,0.35);border-radius:16px;text-align:center;position:relative;overflow:hidden}
  .club-banner::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:conic-gradient(from 0deg,transparent,rgba(200,255,0,0.06),transparent,rgba(255,215,0,0.06),transparent);animation:bannerSpin 6s linear infinite}
  @keyframes bannerSpin{to{transform:rotate(360deg)}}
  .club-banner-inner{position:relative;z-index:1}
  .club-name{font-size:22px;font-weight:900;color:#c8ff00;text-shadow:0 0 20px rgba(200,255,0,0.5),0 2px 4px rgba(0,0,0,0.5);letter-spacing:2px;margin-bottom:4px}
  .club-badge{display:inline-block;padding:3px 12px;background:rgba(200,255,0,0.15);border:1px solid rgba(200,255,0,0.3);border-radius:20px;font-size:10px;color:rgba(255,255,255,0.6);letter-spacing:1px}
  .club-msg{font-size:11px;color:rgba(255,255,255,0.45);margin-top:6px;line-height:1.5}
  .subtitle{font-size:14px;color:rgba(255,255,255,0.65);margin-bottom:3px;font-weight:700}
  .subtitle-small{font-size:11px;color:rgba(255,255,255,0.35);margin-bottom:16px}
  .name-section{width:80%;margin-bottom:14px}
  .name-input{width:100%;padding:11px 16px;font-size:15px;font-weight:700;font-family:'Noto Sans KR',sans-serif;border:2px solid rgba(200,255,0,0.3);border-radius:14px;background:rgba(200,255,0,0.06);color:#fff;text-align:center;outline:none;transition:border-color 0.2s}
  .name-input::placeholder{color:rgba(255,255,255,0.25)}
  .name-input:focus{border-color:#c8ff00}
  .name-hint{font-size:10px;color:rgba(255,255,255,0.25);margin-top:4px;text-align:center}
  .btn{background:linear-gradient(135deg,#c8ff00,#7acc00);color:#0a1628;border:none;padding:14px 40px;font-size:16px;font-weight:900;font-family:'Noto Sans KR',sans-serif;border-radius:50px;cursor:pointer;margin:6px;transition:all 0.2s;box-shadow:0 4px 20px rgba(200,255,0,0.3);pointer-events:auto}
  .btn:active{transform:scale(0.95)}
  .btn-small{padding:10px 24px;font-size:13px}
  .btn-share{background:linear-gradient(135deg,#fee500,#f0d000);color:#3c1e1e}
  .score-display{font-family:'Press Start 2P',monospace;font-size:44px;color:#fff;text-shadow:0 0 30px rgba(200,255,0,0.4);margin:8px 0}
  .best-score{font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:12px}
  .ranking-box{background:rgba(255,255,255,0.06);border:1px solid rgba(200,255,0,0.15);border-radius:16px;padding:14px;width:85%;margin:8px 0;max-height:220px;overflow-y:auto}
  .ranking-box h3{color:#c8ff00;font-size:13px;margin-bottom:8px;text-align:center}
  .rank-row{display:flex;justify-content:space-between;align-items:center;padding:5px 4px;font-size:12px;color:rgba(255,255,255,0.75);border-bottom:1px solid rgba(255,255,255,0.05)}
  .rank-row:last-child{border:none}
  .rank-row.me{background:rgba(200,255,0,0.08);border-radius:8px}
  .rank-left{display:flex;align-items:center;gap:6px}
  .rank-medal{font-size:15px;width:20px;text-align:center}
  .rank-num{font-family:'Orbitron',monospace;font-size:10px;color:rgba(255,255,255,0.3);width:20px;text-align:center}
  .rank-name{font-weight:700}
  .rank-pts{color:#c8ff00;font-family:'Press Start 2P',monospace;font-size:10px}
  .rank-date{font-size:8px;color:rgba(255,255,255,0.18);margin-left:3px}
  .ranking-loading{text-align:center;font-size:11px;color:rgba(255,255,255,0.25);padding:10px}
  .hint{font-size:11px;color:rgba(255,255,255,0.3);margin-top:12px;line-height:1.6}
  .quiz-box{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(10,22,40,0.95);border:2px solid #c8ff00;border-radius:20px;padding:24px;text-align:center;display:none;z-index:10;pointer-events:auto;min-width:260px}
  .quiz-box.visible{display:block}
  .quiz-box .question{font-family:'Press Start 2P',monospace;font-size:22px;color:#fff;margin:12px 0 18px}
  .quiz-box .quiz-label{font-size:12px;color:#c8ff00}
  .quiz-options{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .quiz-btn{background:rgba(200,255,0,0.1);border:1px solid rgba(200,255,0,0.3);color:#fff;padding:12px;font-size:18px;font-weight:700;border-radius:12px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all 0.15s}
  .quiz-btn:active{background:rgba(200,255,0,0.3)}
  .quiz-btn.correct{background:rgba(0,200,50,0.4);border-color:#00c832}
  .quiz-btn.wrong{background:rgba(255,50,50,0.4);border-color:#ff3232}
  .combo-popup{position:absolute;font-family:'Press Start 2P',monospace;font-size:14px;color:#c8ff00;text-shadow:0 0 10px rgba(200,255,0,0.8);pointer-events:none;animation:comboUp 0.8s ease-out forwards}
  @keyframes comboUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-40px) scale(1.3)}}
</style>
</head>
<body>
<div id="gameWrapper">
  <canvas id="game"></canvas>
  <div id="uiOverlay" class="active">
    <!-- START -->
    <div id="startScreen" class="screen visible">
      <div style="font-size:56px;margin-bottom:8px;">🎾</div>
      <div class="title">FLAPPY<br>TENNIS</div>
      <div class="club-banner">
        <div class="club-banner-inner">
          <div class="club-badge">⭐ PRESENTED BY ⭐</div>
          <div class="club-name">🎾 팝테니스 화원옥포</div>
          <div class="club-msg">우리 회원님들을 위해 특별히 만든 게임 🎁</div>
        </div>
      </div>
      <div class="name-section">
        <input type="text" class="name-input" id="nameInput" placeholder="이름 입력 (예: 홍길동)" maxlength="8">
        <div class="name-hint">랭킹에 표시될 이름이에요</div>
      </div>
      <div class="ranking-box">
        <h3>🏆 화원옥포 랭킹 TOP 5</h3>
        <div id="startRankList"><div class="ranking-loading">불러오는 중...</div></div>
      </div>
      <button class="btn" onclick="startGame()">게임 시작</button>
      <div class="hint">
        화면 터치 → 공이 올라갑니다<br>
        네트 사이를 통과하세요!<br>
        🧠 5점마다 두뇌 퀴즈 보너스
      </div>
    </div>

    <!-- GAME OVER -->
    <div id="gameOverScreen" class="screen">
      <div style="font-size:14px;color:rgba(255,255,255,0.5);margin-bottom:4px;">GAME OVER</div>
      <div class="score-display" id="finalScore">0</div>
      <div class="best-score" id="bestScoreText">최고기록: 0</div>
      <div class="ranking-box">
        <h3>🏆 화원옥포 랭킹</h3>
        <div id="resultRankList"></div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;">
        <button class="btn" onclick="startGame()">다시하기</button>
        <button class="btn btn-small" onclick="goHome()">홈으로</button>
        <button class="btn btn-small btn-share" onclick="shareScore()">카톡 공유</button>
      </div>
      <div class="hint">점수를 공유하고 회원님들과 경쟁하세요!</div>
    </div>
  </div>
  <div class="quiz-box" id="quizBox">
    <div class="quiz-label">🧠 두뇌 퀴즈 보너스!</div>
    <div class="question" id="quizQuestion">?</div>
    <div class="quiz-options" id="quizOptions"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
// ─── FIREBASE ───
var db=null,fbOK=false;
try{firebase.initializeApp({apiKey:"AIzaSyAhJC21VhFB3girRgLgCMPW_xWp-qcy70M",authDomain:"tennis-score-a3654.firebaseapp.com",databaseURL:"https://tennis-score-a3654-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"tennis-score-a3654"});db=firebase.database();fbOK=true;}catch(e){}
function getRef(){return fbOK?db.ref('flappy-pop/rankings'):null;}

// ─── RANKING FUNCTIONS ───
function saveScore(name,sc,brain){
  var key=name.replace(/[.#$/\[\]]/g,'_');
  var entry={name:name,score:sc,brain:brain,date:new Date().toISOString()};
  try{var lo=JSON.parse(localStorage.getItem('flappyPopRank')||'{}');if(!lo[key]||sc>lo[key].score)lo[key]=entry;localStorage.setItem('flappyPopRank',JSON.stringify(lo));}catch(e){}
  var ref=getRef();if(!ref)return;
  ref.child(key).once('value').then(function(s){var ex=s.val();if(!ex||sc>ex.score)ref.child(key).set(entry);}).catch(function(){});
}

function loadRankings(tid){
  var c=document.getElementById(tid);
  c.innerHTML='<div class="ranking-loading">불러오는 중...</div>';
  var ref=getRef();
  function render(entries){
    if(!entries||entries.length===0){c.innerHTML='<div class="ranking-loading">아직 기록이 없습니다. 첫 도전자가 되세요!</div>';return;}
    entries.sort(function(a,b){return b.score-a.score;});
    var medals=['🥇','🥈','🥉'],me=document.getElementById('nameInput').value.trim()||playerName;
    c.innerHTML='';
    entries.slice(0,10).forEach(function(e,i){
      var isMe=e.name===me,row=document.createElement('div');
      row.className='rank-row'+(isMe?' me':'');
      var ds=e.date?new Date(e.date).toLocaleDateString('ko-KR',{month:'short',day:'numeric'}):'';
      row.innerHTML='<div class="rank-left">'+(i<3?'<span class="rank-medal">'+medals[i]+'</span>':'<span class="rank-num">'+(i+1)+'</span>')+'<span class="rank-name">'+e.name+(isMe?' 👈':'')+'</span></div><div><span class="rank-pts">'+e.score+'</span><span class="rank-date">'+ds+'</span></div>';
      c.appendChild(row);
    });
  }
  function tryLocal(){try{render(Object.values(JSON.parse(localStorage.getItem('flappyPopRank')||'{}')));}catch(e){c.innerHTML='<div class="ranking-loading">오프라인 모드</div>';}}
  if(ref){ref.orderByChild('score').limitToLast(10).once('value').then(function(s){var d=s.val();if(!d){tryLocal();return;}render(Object.values(d));}).catch(tryLocal);}else{tryLocal();}
}

// ─── CANVAS ───
var canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
var W=420,H=746;canvas.width=W;canvas.height=H;
var ball,pipes=[],score=0,bestScore,gameState,frameCount=0;
var combo=0,quizPending=false,quizActive=false,brainScore=0;
var particles=[],playerName='';
var GRAVITY=0.38,JUMP=-6.8,PIPE_SPEED=2.5,PIPE_GAP=155,PIPE_INTERVAL=110,BALL_R=16;
var COURT_GREEN='#2d7a3a',COURT_DARK='#1e5a28',BALL_YELLOW='#c8ff00';

bestScore=parseInt(localStorage.getItem('flappyPopBest')||'0');
playerName=localStorage.getItem('flappyPopName')||'';
document.getElementById('nameInput').value=playerName;
loadRankings('startRankList');

function resetBall(){return{x:W*0.28,y:H/2,vy:0,rotation:0,trail:[]};}
function createPipe(x){var minTop=80,maxTop=H-PIPE_GAP-140;var topH=minTop+Math.random()*(maxTop-minTop);return{x:x,topH:topH,bottomY:topH+PIPE_GAP,passed:false,w:52};}
function spawnParticles(x,y,color,count){for(var i=0;i<count;i++){particles.push({x:x,y:y,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6,life:1,color:color,r:Math.random()*3+1});}}

function generateQuiz(){var types=['add','sub','mul','tennis'];var type=types[Math.floor(Math.random()*types.length)];var q,answer;
if(type==='add'){var a=Math.floor(Math.random()*40)+10,b=Math.floor(Math.random()*40)+10;q=a+' + '+b;answer=a+b;}
else if(type==='sub'){var a=Math.floor(Math.random()*50)+30,b=Math.floor(Math.random()*25)+5;q=a+' - '+b;answer=a-b;}
else if(type==='mul'){var a=Math.floor(Math.random()*9)+2,b=Math.floor(Math.random()*9)+2;q=a+' × '+b;answer=a*b;}
else{var tq=[{q:'테니스 한 세트\n최소 게임수?',a:6},{q:'듀스 점수?',a:40},{q:'타이브레이크\n목표 점수?',a:7},{q:'단식 코트\n너비(ft)?',a:27},{q:'복식 코트\n너비(ft)?',a:36},{q:'서브\n최대 횟수?',a:2},{q:'Love의\n점수는?',a:0},{q:'네트 높이\n중앙(cm)?',a:91}];var pick=tq[Math.floor(Math.random()*tq.length)];q=pick.q;answer=pick.a;}
var options=[answer];while(options.length<4){var fake=answer+(Math.floor(Math.random()*11)-5);if(fake!==answer&&options.indexOf(fake)===-1&&fake>=0)options.push(fake);}
options.sort(function(){return Math.random()-0.5;});return{q:q,answer:answer,options:options};}

function showQuiz(){quizActive=true;gameState='quiz';var quiz=generateQuiz();document.getElementById('quizQuestion').innerText=quiz.q;var od=document.getElementById('quizOptions');od.innerHTML='';
quiz.options.forEach(function(opt){var btn=document.createElement('button');btn.className='quiz-btn';btn.innerText=opt;btn.onclick=function(){
if(opt===quiz.answer){btn.classList.add('correct');score+=3;brainScore++;spawnParticles(W/2,H/2,'#00ff88',20);showCombo('🧠 +3!',W/2,H/2-60);}
else{btn.classList.add('wrong');od.querySelectorAll('.quiz-btn').forEach(function(b){if(parseInt(b.innerText)===quiz.answer)b.classList.add('correct');});}
setTimeout(function(){document.getElementById('quizBox').classList.remove('visible');quizActive=false;quizPending=false;gameState='playing';},600);};od.appendChild(btn);});
document.getElementById('quizBox').classList.add('visible');}

function showCombo(text,x,y){var el=document.createElement('div');el.className='combo-popup';el.style.left=x+'px';el.style.top=y+'px';el.innerText=text;document.getElementById('gameWrapper').appendChild(el);setTimeout(function(){el.remove();},800);}

function goHome(){gameState='idle';pipes=[];particles=[];ball=resetBall();
document.getElementById('uiOverlay').classList.add('active');document.getElementById('gameOverScreen').classList.remove('visible');document.getElementById('startScreen').classList.add('visible');loadRankings('startRankList');}

function copyFallback(text){var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand('copy');alert('점수가 복사되었습니다!\n카카오톡에 붙여넣기 하세요 📋');}catch(e){prompt('아래 텍스트를 복사하세요:',text);}document.body.removeChild(ta);}
function shareScore(){var msg='🎾 플래피 테니스 🎾\n\n👤 '+playerName+'\n📊 점수: '+score+'점\n🧠 두뇌점수: '+brainScore+'\n🏆 최고기록: '+bestScore+'점\n\n팝테니스 화원옥포 회원님들!\n이 점수 넘어봐~ 😎🔥\n\n▶ 도전하기: https://hoons9096-cloud.github.io/PoP/flappy-tennis-pop.html';
if(navigator.share){navigator.share({title:'플래피 테니스',text:msg}).catch(function(){copyFallback(msg);});}
else if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(msg).then(function(){alert('점수가 복사되었습니다!\n카카오톡에 붙여넣기 하세요 📋');}).catch(function(){copyFallback(msg);});}
else{copyFallback(msg);}}

// ─── DRAWING ───
function drawBackground(){var sg=ctx.createLinearGradient(0,0,0,H);sg.addColorStop(0,'#0d2137');sg.addColorStop(0.5,'#1a3a5c');sg.addColorStop(1,'#0a1628');ctx.fillStyle=sg;ctx.fillRect(0,0,W,H);
ctx.strokeStyle='rgba(200,255,0,0.04)';ctx.lineWidth=1;for(var i=0;i<W;i+=40){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,H);ctx.stroke();}for(var i=0;i<H;i+=40){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(W,i);ctx.stroke();}
var gy=H-50;ctx.fillStyle=COURT_GREEN;ctx.fillRect(0,gy,W,50);ctx.fillStyle=COURT_DARK;ctx.fillRect(0,gy,W,3);ctx.fillStyle='#fff';ctx.fillRect(0,gy,W,2);for(var i=0;i<W;i+=30){ctx.fillStyle='rgba(255,255,255,0.06)';ctx.fillRect(i,gy+5,15,45);}}

function drawPipe(p){var nw=p.w;ctx.fillStyle='#667788';ctx.fillRect(p.x-3,0,nw+6,p.topH);ctx.fillStyle='#556677';ctx.fillRect(p.x,0,nw,p.topH);
ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1;for(var y=0;y<p.topH;y+=12){ctx.beginPath();ctx.moveTo(p.x,y);ctx.lineTo(p.x+nw,y);ctx.stroke();}for(var x=p.x;x<p.x+nw;x+=12){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,p.topH);ctx.stroke();}
ctx.fillStyle='#fff';ctx.fillRect(p.x-4,p.topH-4,nw+8,6);
ctx.fillStyle='#667788';ctx.fillRect(p.x-3,p.bottomY,nw+6,H-p.bottomY-50);ctx.fillStyle='#556677';ctx.fillRect(p.x,p.bottomY,nw,H-p.bottomY-50);
for(var y=p.bottomY;y<H-50;y+=12){ctx.beginPath();ctx.moveTo(p.x,y);ctx.lineTo(p.x+nw,y);ctx.stroke();}for(var x=p.x;x<p.x+nw;x+=12){ctx.beginPath();ctx.moveTo(x,p.bottomY);ctx.lineTo(x,H-50);ctx.stroke();}
ctx.fillStyle='#fff';ctx.fillRect(p.x-4,p.bottomY,nw+8,6);}

function drawBall(){ball.trail.forEach(function(t,i){var a=(i/ball.trail.length)*0.3;ctx.beginPath();ctx.arc(t.x,t.y,BALL_R*0.7,0,Math.PI*2);ctx.fillStyle='rgba(200,255,0,'+a+')';ctx.fill();});
var gw=ctx.createRadialGradient(ball.x,ball.y,BALL_R*0.5,ball.x,ball.y,BALL_R*2.5);gw.addColorStop(0,'rgba(200,255,0,0.25)');gw.addColorStop(1,'rgba(200,255,0,0)');ctx.fillStyle=gw;ctx.beginPath();ctx.arc(ball.x,ball.y,BALL_R*2.5,0,Math.PI*2);ctx.fill();
ctx.save();ctx.translate(ball.x,ball.y);ctx.rotate(ball.rotation);var bg=ctx.createRadialGradient(-3,-3,2,0,0,BALL_R);bg.addColorStop(0,'#e8ff66');bg.addColorStop(0.6,BALL_YELLOW);bg.addColorStop(1,'#8faa00');ctx.fillStyle=bg;ctx.beginPath();ctx.arc(0,0,BALL_R,0,Math.PI*2);ctx.fill();
ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,0,BALL_R*0.65,-0.8,0.8);ctx.stroke();ctx.beginPath();ctx.arc(0,0,BALL_R*0.65,Math.PI-0.8,Math.PI+0.8);ctx.stroke();
ctx.fillStyle='rgba(255,255,255,0.1)';ctx.beginPath();ctx.arc(-2,-2,BALL_R*0.4,0,Math.PI*2);ctx.fill();ctx.restore();}

function drawParticles(){particles.forEach(function(p){ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();});ctx.globalAlpha=1;}

function drawScore(){if(gameState!=='playing'&&gameState!=='quiz')return;ctx.save();ctx.font='900 36px "Press Start 2P",monospace';ctx.textAlign='center';ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillText(score,W/2+2,54);ctx.fillStyle='#fff';ctx.shadowColor='rgba(200,255,0,0.5)';ctx.shadowBlur=15;ctx.fillText(score,W/2,52);ctx.restore();
if(brainScore>0){ctx.font='600 12px "Noto Sans KR",sans-serif';ctx.fillStyle='rgba(200,255,0,0.7)';ctx.textAlign='right';ctx.fillText('🧠 ×'+brainScore,W-16,30);}}

// ─── GAME LOGIC ───
function startGame(){
  var ni=document.getElementById('nameInput');playerName=ni.value.trim();
  if(!playerName){ni.style.borderColor='#ff4444';ni.focus();ni.placeholder='이름을 입력해주세요!';setTimeout(function(){ni.style.borderColor='rgba(200,255,0,0.3)';},1500);return;}
  localStorage.setItem('flappyPopName',playerName);

  ball=resetBall();pipes=[];score=0;combo=0;brainScore=0;quizPending=false;quizActive=false;frameCount=0;particles=[];gameState='playing';
  document.getElementById('uiOverlay').classList.remove('active');document.getElementById('startScreen').classList.remove('visible');document.getElementById('gameOverScreen').classList.remove('visible');document.getElementById('quizBox').classList.remove('visible');
}

function jump(){if(gameState==='quiz'||quizActive)return;if(gameState!=='playing')return;ball.vy=JUMP;spawnParticles(ball.x,ball.y+BALL_R,'rgba(200,255,0,0.6)',5);}

function gameOver(){gameState='over';spawnParticles(ball.x,ball.y,'#ff4444',30);
if(score>bestScore){bestScore=score;localStorage.setItem('flappyPopBest',bestScore);}
saveScore(playerName,score,brainScore);
setTimeout(function(){document.getElementById('finalScore').innerText=score;document.getElementById('bestScoreText').innerText='최고기록: '+bestScore;
loadRankings('resultRankList');
document.getElementById('uiOverlay').classList.add('active');document.getElementById('gameOverScreen').classList.add('visible');},400);}

function checkCollision(){var gy=H-50;if(ball.y+BALL_R>gy||ball.y-BALL_R<0)return true;for(var i=0;i<pipes.length;i++){var p=pipes[i];if(ball.x+BALL_R>p.x&&ball.x-BALL_R<p.x+p.w){if(ball.y-BALL_R<p.topH||ball.y+BALL_R>p.bottomY)return true;}}return false;}

function update(){if(gameState!=='playing')return;frameCount++;ball.vy+=GRAVITY;ball.y+=ball.vy;ball.rotation+=ball.vy*0.04;
ball.trail.push({x:ball.x,y:ball.y});if(ball.trail.length>8)ball.trail.shift();
if(frameCount%PIPE_INTERVAL===0)pipes.push(createPipe(W+60));
pipes.forEach(function(p){p.x-=PIPE_SPEED;if(!p.passed&&p.x+p.w<ball.x){p.passed=true;score++;combo++;spawnParticles(ball.x,ball.y,'#c8ff00',8);
if(combo>=3)showCombo(combo+' COMBO!',ball.x+30,ball.y-30);
if(score>0&&score%5===0&&!quizPending){quizPending=true;setTimeout(function(){if(gameState==='playing')showQuiz();},300);}}});
pipes=pipes.filter(function(p){return p.x+p.w>-20;});
particles.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.life-=0.025;p.vy+=0.08;});particles=particles.filter(function(p){return p.life>0;});
if(checkCollision())gameOver();}

function render(){drawBackground();pipes.forEach(drawPipe);if(gameState==='playing'||gameState==='quiz'||gameState==='over')drawBall();drawParticles();drawScore();
if(gameState==='idle'){var iy=H/2+Math.sin(Date.now()*0.003)*20;ball=ball||resetBall();ball.y=iy;ball.rotation=Date.now()*0.001;drawBall();}
requestAnimationFrame(render);}
function gameLoop(){update();requestAnimationFrame(gameLoop);}

canvas.addEventListener('pointerdown',function(e){e.preventDefault();jump();});
document.addEventListener('keydown',function(e){if(e.code==='Space'){e.preventDefault();jump();}});

gameState='idle';ball=resetBall();render();gameLoop();
</script>
</body>
